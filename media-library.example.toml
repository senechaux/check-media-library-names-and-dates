# Todas las rutas se resuelven respecto a este TOML. Crear solo source a mano.
[paths]
source = "sample/source"
workspace = "sample/workspace"
archive = "sample/archive"
export = "sample/export"

[inventory]
exclude = [".DS_Store", ".localized", "**/.DS_Store", "**/.localized"]

[execution]
timeout_seconds = 60
# Reserva por volumen; al escribir se comprueba además el tamaño de cada copia.
reserve_bytes = 1048576

[tools.ffprobe]
executable = "ffprobe"
version_args = ["-version"]
capability_args = ["-h", "full"]
required_capabilities = ["-show_format", "-show_streams", "-print_format"]

[pipeline]
include = ["*"] # Patrones de rutas relativas, después de las exclusiones.

[pipeline.modes]
import_review = "manual"
metadata = "manual"    # Servicio real: compara y valida copias; auto escribe/renombra según política explícita.
normalize = "manual"   # Real: MP4 por remux o una única recodificación combinada.
compression = "manual" # Real: HandBrake + validación técnica y fechas.
installation = "auto"  # Real, solo instala candidatos previamente validados.
export = "auto"        # Real: receta, fuente registrada, derivado y vigencia; revisión visual de vídeo separada.
audit = "auto"         # Real: cobertura local y validación antes de entregar.
delivery = "disabled"  # Local. manual exige declaración; auto solo con CLI configurada y opt-in.

[dates]
policy = "review" # filename-to-metadata | metadata-to-filename, solo tras revisión explícita.
# timezone = "Europe/Madrid" # Elegir para el lote; no deducirla del ordenador o de diferencias horarias.
quicktime_semantics = "unknown" # utc | local solo cuando se conozca el origen.
allow_create_date_fallback = false
remove_historical = false
discard_description = false
set_file_modify_date = false
set_file_create_date = false # macOS + SetFile; capacidad y resultado verificados.

# Para fijar una ruta de ExifTool (será una herramienta requerida por preflight):
# [tools.exiftool]
# executable = "/ruta/exiftool"
# version_args = ["-ver"]

[video]
min_bytes = 50000000
profile = "archive-720p30" # height-720 es una política vertical distinta.
frame_rate_mode = "pfr"   # cfr exige 30 constantes.
quality = 22             # Propuesta: revisar muestra visual antes de publicar.
encoder_preset = "fast"
audio_encoder = "ffmpeg_aac" # AAC estéreo; el vídeo de HandBrake se copia, sin recodificarlo otra vez.
min_savings_bytes = 1
min_savings_ratio = 0.0
allow_remux_growth = false
historical_policy = "review"
quality_reviewed = false  # La validación técnica no acredita calidad visual.

# Opcional: declarar las herramientas hace que preflight las exija.
# [tools.HandBrakeCLI]
# executable = "HandBrakeCLI"
# version_args = ["--version"]
# [tools.ffmpeg]
# executable = "ffmpeg"
# version_args = ["-version"]

[export]
images = true
videos = true
image_max_side = 1200
image_quality = 90
color_policy = "preserve-icc"
video_profile = "upload-480p30"
video_quality = 22
video_frame_rate_mode = "pfr"
video_quality_reviewed = false # No publicar recodificación de carga sin revisión visual declarada.
require_capture_date = true
use_archived_original = true

[delivery]
mode = "disabled" # manual requiere pipeline.modes.delivery="manual".
target = "manual" # Alias no secreto; no es autenticación.
require_capture_date = true
# Para backup del estado tras entregar, configurar AMBAS rutas disjuntas:
# state_dir = "sample/uploader-state"
# backup_dir = "sample/uploader-state-backup"
# configured-cli exige pipeline.modes.delivery="auto", allow_cli=true y un
# adaptador con protocolo de alcance; véase docs/delivery-protocol.md.
